[server]
address = "localhost"
port = 8765
headless = true
runOnSave = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = true

# Palette must match services/styling.py (the injected CSS is the source of
# truth for surfaces). These values feed Streamlit's native widgets — sliders,
# checkboxes, multiselect tags, focus carets — that the injected CSS doesn't
# reach. Keeping them in sync prevents a second accent colour leaking through.
[theme]
base = "dark"
primaryColor = "#2DAF7E"
backgroundColor = "#12161B"
secondaryBackgroundColor = "#1A1F26"
textColor = "#ECEEF1"
font = "sans serif"

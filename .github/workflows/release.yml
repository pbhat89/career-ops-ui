name: Release Please

# Disabled on personal fork (pbhat89/career-ops-ui) — this fork doesn't publish
# versioned releases to npm or GitHub Releases. The workflow stays in the repo
# so it can be revived manually via the Actions tab if ever needed.
# Original trigger was: on: push, branches: [main]
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
